name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/FoodOrdering.Web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/FoodOrdering.Web/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/FoodOrdering.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/FoodOrdering.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
